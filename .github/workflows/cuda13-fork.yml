name: CUDA 13 E2E (fork only)

on:
  workflow_dispatch:
  pull_request:
    branches: [sycl]

permissions: read-all

env:
  ADAPTER_DIR: /__w/cuda13_adapter/${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  image:
    runs-on: [Linux, cuda13]
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        path: src
        sparse-checkout: devops
    - name: Build and push CUDA 13 image
      env:
        IMAGE: ghcr.io/${{ github.repository }}/ubuntu2404_build_cuda13:latest
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
        docker build -t "$IMAGE" \
          --build-arg base_image=nvidia/cuda:13.1.0-devel-ubuntu24.04 \
          -f src/devops/containers/ubuntu2404_build.Dockerfile src/devops
        docker push "$IMAGE"

  adapter:
    needs: [image]
    runs-on: [Linux, cuda13]
    container:
      image: ghcr.io/${{ github.repository }}/ubuntu2404_build_cuda13:latest
      options: -u 1001:1001
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        path: src
        sparse-checkout: |
          unified-runtime
          xpti
          xptifw
          sycl/cmake/modules
    - name: Build UR CUDA adapter
      run: |
        cmake -G Ninja -S src/unified-runtime -B ur-build \
          -DCMAKE_BUILD_TYPE=Release -DUR_BUILD_ADAPTER_CUDA=ON \
          -DUR_ENABLE_TRACING=ON -DUR_BUILD_TESTS=OFF -DUR_BUILD_EXAMPLES=OFF
        nvcc=$(sed -n 's/^CUDAToolkit_NVCC_EXECUTABLE:FILEPATH=//p' ur-build/CMakeCache.txt)
        echo "$nvcc"
        "$nvcc" --version
        cmake --build ur-build --target ur_adapter_cuda
        mkdir -p "$ADAPTER_DIR"
        cp -P ur-build/lib/libur_adapter_cuda.so* "$ADAPTER_DIR"/
        ls -l "$ADAPTER_DIR"

  build-and-test:
    needs: [adapter]
    runs-on: [Linux, cuda13]
    container:
      image: ghcr.io/${{ github.repository }}/ubuntu2404_build_cuda13:latest
      options: -u 1001:1001 --gpus all --cap-add SYS_ADMIN
    env:
      CCACHE_DIR: /__w/build_cache_cuda13
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        path: src
    - name: Configure
      env:
        CUDA_LIB_PATH: /usr/local/cuda/lib64/stubs
      run: |
        python3 src/buildbot/configure.py -w $GITHUB_WORKSPACE \
          -s $GITHUB_WORKSPACE/src -o $GITHUB_WORKSPACE/build \
          -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/toolchain -t Release \
          --ci-defaults --use-zstd --cuda --native_cpu \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DLLVM_INSTALL_UTILS=ON -DSYCL_UR_FORCE_FETCH_LEVEL_ZERO=ON
    - run: cmake --build build --target sycl-toolchain
    - name: Install toolchain
      run: |
        cmake --build build --target deploy-sycl-toolchain
        cmake --build build --target install-sycl-test-utilities
        echo PATH=$GITHUB_WORKSPACE/toolchain/bin:$PATH >> $GITHUB_ENV
        echo LD_LIBRARY_PATH=$GITHUB_WORKSPACE/toolchain/lib:$LD_LIBRARY_PATH >> $GITHUB_ENV
    - name: Use CUDA adapter from the adapter job
      run: |
        rm -f toolchain/lib/libur_adapter_cuda.so*
        cp -P "$ADAPTER_DIR"/libur_adapter_cuda.so* toolchain/lib/
        ls -l toolchain/lib/libur_adapter_cuda.so*
    - name: Setup Vulkan environment
      uses: ./src/devops/actions/setup-vulkan/linux
    - run: dpsycl-ls --verbose
    - name: Run E2E tests
      uses: ./src/devops/actions/run-tests/linux/e2e
      timeout-minutes: 60
      with:
        ref: ${{ github.sha }}
        testing_mode: full
        target_devices: cuda:gpu
        extra_lit_opts: --param sycl_build_targets=nvidia
    - name: Remove adapter hand-off directory
      if: always()
      run: rm -rf "$ADAPTER_DIR"
